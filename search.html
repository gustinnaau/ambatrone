<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | Ambatron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<style>
*{box-sizing:border-box}.search-page{min-height:100vh;padding:0 5vw 80px;background:#f6f6f2;color:#171717}.search-main{max-width:1160px;margin:0 auto;padding-top:72px}.search-heading{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:34px}.search-heading p{margin:0 0 10px;color:#72812d;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.search-heading h1{margin:0;font:600 clamp(38px,6vw,68px)/1 'Space Grotesk',sans-serif}.search-field{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:2px solid #171717;background:#fff}.search-field svg{width:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}.search-field input{width:min(36vw,400px);min-width:0;padding:17px 0;border:0;outline:0;background:transparent;color:inherit;font:inherit}.search-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #17171722}.search-product{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:20px;min-height:180px;padding:18px 22px 18px 0;border-bottom:1px solid #17171722}.search-product:nth-child(odd){margin-right:24px}.search-product img{width:140px;height:140px;object-fit:cover;background:#e7e8e2}.search-product p{margin:0 0 8px;color:#74766c;font-size:11px;text-transform:uppercase}.search-product h2{margin:0 0 12px;font:600 20px 'Space Grotesk',sans-serif}.search-product strong{font-size:14px}.search-product button{align-self:end;padding:10px 13px;border:0;background:#171717;color:white;font:700 11px Manrope,sans-serif;text-transform:uppercase;cursor:pointer}.search-product button:hover{background:#758d25}.search-empty{grid-column:1/-1;padding:40px 0;color:#686a62}.cart-count{position:absolute;top:-5px;right:-5px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#c7ff42;color:#171717;font-size:10px;font-weight:800}.icons a[aria-label="Cart"],.nav__icons a[aria-label="Cart"]{position:relative}.nav{position:relative!important}.search-page .nav{margin:0 -5.56vw!important;width:111.12%!important}.nav .account-control{position:relative}.account-menu{z-index:5}@media(max-width:760px){.search-heading{align-items:stretch;flex-direction:column}.search-field input{width:100%}.search-results{grid-template-columns:1fr}.search-product:nth-child(odd){margin-right:0}.search-product{grid-template-columns:100px 1fr auto;gap:14px;min-height:140px;padding-right:0}.search-product img{width:100px;height:100px}.search-product h2{font-size:17px}.search-product button{padding:9px;font-size:10px}}
</style>
<style>
.search-page{margin:0;font-family:'Manrope',sans-serif}
.search-page .nav a{text-decoration:none;color:inherit}
.search-product{grid-template-columns:minmax(0,1fr) 132px;gap:20px;min-height:132px;padding:20px 0}
.search-product>div{min-width:0}
.search-product button{display:inline-flex;align-items:center;justify-content:center;gap:9px;align-self:center;width:132px;min-height:44px;padding:0 12px;border:1px solid #171717;border-bottom:3px solid #b6d942;border-radius:2px;background:#171717;color:#fff;font:700 11px Manrope,sans-serif;letter-spacing:0;text-transform:uppercase;transition:background .18s ease,color .18s ease,transform .18s ease}
.search-product button::before{content:'+';color:#c7ff42;font-size:19px;font-weight:500;line-height:1}
.search-product button:hover{transform:translateY(-2px);background:#c7ff42;color:#171717}
.search-product button:hover::before,.search-product button.is-added::before{color:#171717}
.search-product button:focus-visible{outline:3px solid #718b25;outline-offset:3px}
.search-product button.is-added{background:#c7ff42;color:#171717}
@media(max-width:760px){.search-product{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:12px;min-height:150px}.search-product>div{grid-column:1;grid-row:1}.search-product button{grid-column:1;grid-row:2;justify-self:start;align-self:start;width:132px;min-height:38px}.search-product:nth-child(odd){margin-right:0}}
</style>
</head>
<body class="search-page">
<nav class="nav"><a class="logo" href="index.html#home"><img src="amba-logo.svg" alt="Ambatron"></a><div class="links"><a href="index.html#home">Home</a><a href="drones.html">Drones</a><a href="about.html">About</a><a href="support.html">Support</a></div><div class="icons"><a href="search.html" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></a><a href="checkout.html" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-7H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></a><a href="login.html" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></a></div></nav>
<main class="search-main"><div class="search-heading"><div><p>Ambatron Store</p><h1>Find your next view.</h1></div><label class="search-field"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="product-search" type="search" placeholder="Search drones and cameras" autocomplete="off" aria-label="Search products"></label></div><section id="search-results" class="search-results" aria-live="polite"></section></main>
</body>
</html>
